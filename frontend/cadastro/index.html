<!DOCTYPE html>
<head>
    <title>ODS - Cadastro</title>
    <script src="../js/register.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/ONU_Logo.svg">
    <link rel="stylesheet" href="../css/registar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main">
        <img src="../img/ODS_Logo.svg" alt="UN Logo" id="odsLogo"></img>
        <div id="bg" class="object">
            <img src="../img/ONU_Logo.svg" alt="UN Logo" id="UnLogo"></img>
            <label class="inputTypeText">E-mail</label>
            <input type="email" class="loginInput" id="email" autocomplete="off"></input>
            <label class="inputTypeText" id="pass">Senha</label>
            <input type="password" class="loginInput" id="password" autocomplete="off"></input>
            <button id="continue">Continuar</button>
        </div>
        <h1 class="mainTitle object">CADASTRE-SE!</h1>
        <p id="subtitle" class="object">Já tem uma conta? <a href="../login/">Entre</a></p> 
        
    </div>
</body>
